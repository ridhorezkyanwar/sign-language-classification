name: Sign Language Classifier CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

permissions:
  contents: read

jobs:
  static-and-label-tests:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Compile application and tests
        run: python -m compileall -q app.py label_mapping.py test_prediction.py tests
      - name: Run label mapping regression tests
        run: python -m unittest discover -s tests -v
